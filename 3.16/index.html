<!DOCTYPE html>
<html>
<head>
<title>Ejercicio 15. Uso de botones</title>
<meta charset="UTF-8" />
<style>
div {
    width: 400px;
    height: 400px;
    border: 1px solid black;
    margin: 10px;
    float: left;
    padding: 30px;
    text-align: center;
    background-color: lightgray;
}
p {
    background-color: white;
	text-align: left;	
}
button{
  margin:auto;
  display:block;
}

</style>
</head>
<body>
<table>
<tr>
<td>
<button type="button" id="boton1">Reiniciar</button> 
</td>
<td>
<button type="button" id="boton2">Reiniciar</button> 
</td>
</tr>
<tr>
<td>
<div id="cuadro1"><p id="parrafo1">Párrafo1</p></div> 
</td>
<td>
<div id="cuadro2"><p id="parrafo2">Párrafo2</p></div> 
</td>
</tr>
</table>

<p id="parrafo3">Párrafo 3</p>

<script>

window.addEventListener("keypress", manejateclado, false);
window.addEventListener("keyup", manejateclado, false);
window.addEventListener("keydown", manejateclado, false);
var X = 400, Y = 400;

inicializaCuadro(document.getElementById("cuadro1"));
inicializaCuadro(document.getElementById("cuadro2"));

function inicializaCuadro(cuadro)
//para no andar repitiendo código definimos una función a la que le pasamos un objeto <div>,
//le asigna el manejador adecuado al ratón y le añade variables para contar los eventos
{
	
	cuadro.addEventListener("mousedown", manejaratongenerico, false);
	cuadro.addEventListener("mouseup", manejaratongenerico, false);
	cuadro.addEventListener("mouseover", manejaratongenerico, false);
	cuadro.addEventListener("mouseout", manejaratongenerico, false);
	cuadro.addEventListener("mousemove", manejaratongenerico, true);
	cuadro.addEventListener("click", manejaratongenerico, false);
	cuadro.addEventListener("contextmenu", manejaratongenerico, false);
	cuadro.addEventListener("dblclick", manejaratongenerico, false);
	cuadro.eventosmousedown = 0;
	cuadro.eventosmouseup = 0;
	cuadro.eventosmouseover = 0;
	cuadro.eventosmouseout = 0;
	cuadro.eventosmousemove = 0;
	cuadro.eventosclick = 0;
	cuadro.eventoscontextmenu = 0;
	cuadro.eventosdblclick = 0;
	//añadimos un indicador de si el cuadro está en modo "cambio de tamaño" o no
	cuadro.cambiable = false;
}

function manejarBoton(e){
   //al pulsar el botón reiniciamos el cuadro correspondiente
   if (e.target.id === "boton1")
   {
	 var cuadro = document.getElementById("cuadro1");
   }
   else
   {
	 var cuadro = document.getElementById("cuadro2");
   }
    
    cuadro.style.width = "400px";
    cuadro.style.height = "400px";
    cuadro.style.backgroundColor = "lightgray";

   //reiniciamos los contadores
   cuadro.eventosmousedown = 0;
   cuadro.eventosmouseup = 0;
   cuadro.eventosmouseover = 0;
   cuadro.eventosmouseout = 0;
   cuadro.eventosmousemove = 0;
   cuadro.eventosclick = 0;
   cuadro.eventoscontextmenu = 0;
   cuadro.eventosdblclick = 0;
   
   //si estaba en modo cambiable, lo desactivamos
   if (cuadro.cambiable == true)
   {
	  cuadro.cambiable = false;
	  cuadro.style.resize = cuadro.resizeAnterior;
	  cuadro.style.overflow = cuadro.overflowAnterior;
	  cuadro.style.backgroundColor = cuadro.colorAnterior;	
   }
   
   var parrafo = (cuadro.id === "cuadro1") ? document.getElementById("parrafo1") : document.getElementById("parrafo2");
   parrafo.innerHTML = "Párrafo reiniciado";
   parrafo.style.backgroundColor = "white";


}
function manejaratongenerico(e)
{
	switch (e.type)
	{
		case "mousedown":this.eventosmousedown++;break;
		case "mouseup":this.eventosmouseup++;break;
		case "mouseover":this.eventosmouseover++;						
						 if (this.cambiable == false)
                           this.style.backgroundColor = "red";
						 break;
		case "mouseout":this.eventosmouseout++;
						if (this.cambiable == false)		
		                  this.style.backgroundColor = "lightgray";
		                break;
		case "mousemove":this.eventosmousemove++;break;
		case "click":this.eventosclick++;
					 if (this.cambiable == false)
		               this.style.backgroundColor = "green";
					 break;
		case "contextmenu":this.eventoscontextmenu++;break;
		case "dblclick":this.eventosdblclick++;
						if (this.cambiable == false)
						{
						  //si no lo estaba, lo ponemos en modo tamaño cambiable
						  this.cambiable = true;
						  //nos guardamos el estilo que tuviera
						  this.resizeAnterior = this.style.resize;
						  this.overflowAnterior = this.style.overflow;
						  this.colorAnterior = this.style.backgroundColor;
						  
						  this.style.resize = "both";
						  this.style.overflow = "auto";
						  this.style.backgroundColor = "Yellow";
						}
						else
						{
						  //si lo estaba, volverlo a modo normal
						  this.cambiable = false;
						  this.style.resize = this.resizeAnterior;
						  this.style.overflow = this.overflowAnterior;
						  this.style.backgroundColor = this.colorAnterior;						  
						}						 
						break;
	}
	
	
	var texto = "mousedown:" + this.eventosmousedown +" mouseup:" + this.eventosmouseup +
                " mouseout:" + this.eventosmouseout + " mouseover:" + this.eventosmouseover +
				" mousemove:" + this.eventosmousemove + " click:" + this.eventosclick +
				" contextmenu:" + this.eventoscontextmenu + " dblclick:" + this.eventosdblclick;

	// averiguamos a qué párrafo dentro del div queremos acceder en función del cuadro donde estemos
	if (this.id === "cuadro1")
	    var destino = "parrafo1";
	else
	    var destino = "parrafo2";
		
	var parrafo = document.getElementById(destino);
	parrafo.innerHTML = texto;
	//no olvidar cambiar el color del párrafo también para que coincida con el del cuadro
	parrafo.style.backgroundColor = this.style.backgroundColor;

    //ahora actualizamos las coordenadas en parrafo3
	texto = "Screen X=" + e.screenX + " Y=" + e.screenY;
	texto += " Page X=" + e.pageX + " Y=" + e.pageY;
	
	var dimensionesinternas = this.getBoundingClientRect();
	texto += " Posición del cuadro: " + dimensionesinternas.left + "," +dimensionesinternas.top + " a " + dimensionesinternas.right + "," + dimensionesinternas.bottom;
	
	/*las posiciones relativas dentro del cuadro se sacan restando las posiciones absolutas en la página y el tamapo del cuadro*/
	var posCuadroX = e.pageX - dimensionesinternas.left;	
	var posCuadroY = e.pageY - dimensionesinternas.top;
	
	texto += " X del cuadro:" + posCuadroX + " Y del cuadro:" + posCuadroY;
	document.getElementById("parrafo3").innerHTML = texto;

 
	
}

function manejateclado (e)
{
	//gestión de tamaño por teclado eliminada

}

document.getElementById("boton1").addEventListener("click", manejarBoton, false);
document.getElementById("boton2").addEventListener("click", manejarBoton, false);

</script>

</body>
</html>
