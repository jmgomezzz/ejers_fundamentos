<!DOCTYPE html>
<html>
<head>
<title>Ejercicio 17.</title>
<meta charset="UTF-8" />
    <style>
      canvas {
        margin: 0px;
        padding: 0px;
		border:1px solid #000000;
		background-color: lightgray;
      }
    </style>
  </head>
  <body>
  <body>
    <div>
      <canvas id="lienzo1" width="800" height="600"></canvas>
	</div>
	<div>
	  <canvas style="background-color: white;" id="lienzo2" width="800" height="100"></canvas>
	</div>
    <script>
    var contextoGrafico = document.getElementById('lienzo1').getContext('2d');
	var contextoTexto = document.getElementById('lienzo2').getContext('2d');

	contextoTexto.font="18px Courier New";
	contextoTexto.fillText("Información gráfica:",10,30);
	contextoTexto.font="28px Times New";
	contextoTexto.strokeText("X = 0 Y = 0",10,60);
	  
	//dibujamos los marcos llamando a la función para cada contexto gráfico indicando el ancho del marco
	dibujaPlantilla(contextoGrafico, 30);	
	dibujaPlantilla(contextoTexto, 5);

	//trsaladamos el origen de coordenadas a (400,300)
	contextoGrafico.translate(400,300);

    //Escalamos al 50%
    contextoGrafico.scale(0.5,0.5);
	
	for (var dibujo = 0; dibujo < 360; dibujo+=10) //vamos de 10 en 10 grados
	{
	    // giramos las coordenadas del lienzo 10 grados. Cada giro se acumula con el anterior salvo que reiniciemos con setTransform()
		contextoGrafico.rotate(10*Math.PI/180);
		dibujaTrazo(contextoGrafico);
	}
	
	
	
	function dibujaTrazo(contexto)
	{
	  contexto.beginPath();
      contexto.moveTo(150, 150);
      contexto.quadraticCurveTo(50, 50, 250, 150);
	  contexto.quadraticCurveTo(500, 100, 350, 350);
	  contexto.closePath();

	  
	  var gradiente = contexto.createLinearGradient(0,0,800,600);
	  gradiente.addColorStop(0,"black");
      gradiente.addColorStop(0.5,"yellow");
      gradiente.addColorStop(1,"white");
      contexto.fillStyle = gradiente;
	  contexto.fill();
	  
      contexto.lineWidth = 10;
      contexto.strokeStyle = 'blue';
      contexto.stroke();
		
	}

	
	function dibujaPlantilla(contexto, ancho)
	  {
		var anterior = contexto.lineWidth; //guardamos el tamaño actual para poder restaurarlo luego
		contexto.lineWidth = ancho;
		//ojo, el trazo dibuja su ancho a ambos lados de la coordenada inicial, por lo que tenemos que pintar el cuadro un poco hacia adentro si queremos que salga entero
		contexto.strokeRect(0+ancho/2,0+ancho/2,contexto.canvas.clientWidth-ancho,contexto.canvas.clientHeight-ancho)
		contexto.lineWidth = anterior;	//restauramos el ancho original		
	  }

    </script>
  </body>
</html>
