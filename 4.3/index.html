<!DOCTYPE html>
<html>
<head>
<title>Ejercicio 4.3. Carga de Imagen</title>
<meta charset="UTF-8" />
    <style>
      canvas {
        margin: 0px;
        padding: 0px;
		border:1px solid #000000;
		background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <div>
      <canvas id="lienzo1" width="800" height="600"></canvas>
	</div>
	<div>
	  <canvas style="background-color: white;" id="lienzo2" width="800" height="100"></canvas>
	</div>
    <script>
      
      var contextoGrafico = document.getElementById('lienzo1').getContext('2d');
	  var contextoTexto = document.getElementById('lienzo2').getContext('2d');

      contextoTexto.font="18px Courier New";
	  contextoTexto.fillText("Información gráfica:",10,15);
	  contextoTexto.font="28px Times New";
	  contextoTexto.strokeText("X = 0 Y = 0",10,60);
	  
	  // Función para cargar una imagen en el contexto
	  function cargaImagen(contexto, nombreImagen) {
	    var imagen = new Image();
	    // Evento onload se ejecuta cuando la imagen se ha cargado completamente
	    imagen.onload = function() {
	      // Obtener el canvas del contexto
	      var canvas = contexto.canvas;
	      // Ajustar la imagen al tamaño del lienzo
	      contexto.drawImage(imagen, 0, 0, canvas.width, canvas.height);
	    };
	    
	    // Asignar la ruta de la imagen (esto inicia la carga)
	    imagen.src = nombreImagen;
	  }
	  
	  cargaImagen(contextoGrafico, '4.3/puesta de sol.jpg')
	</script>
  </body>
</html>
